spring:
  application:
    name: shortly

#|| jdbc:mysql://localhost:3306/shortlydb
#  shorty
#  Shorty@123
  datasource:
    url: ${POSTGRES_URL}
    username:  ${POSTGRES_USERNAME}
    password:  ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        # Optional with Hibernate 6
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRY}
  refresh_expiration: ${JWT_REFERESH_EXPIRY}


server:
  address: 0.0.0.0
  #  port: 8080
  servlet:
    context-path: /api/v1.0
  port: 8080



logging:
  level:
    org.springframework.security: DEBUG

app:
 backend:
   base:
    url: ${BACKEND_URL}